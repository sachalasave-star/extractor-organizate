name: Scrapear

# Corre solo y va acumulando la base en el repo. Con la compu apagada.
on:
  schedule:
    # Dos veces por dia: 00:00 y 12:00 hora Argentina. Con repo publico los
    # minutos son ilimitados, asi que el limite lo pone no golpear a Google
    # demasiado seguido desde el mismo rango de IPs, no la cuota.
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Minutos a correr (max 300)'
        default: '300'

concurrency:                  # dos corridas a la vez pelearian por negocios.db
  group: scrapear
  cancel-in-progress: false

permissions:
  contents: write             # para commitear la base de vuelta

jobs:
  scrapear:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # el scraper corta a los 300: deja margen para el commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Scrapear
        run: python -u scraper.py --minutos ${{ inputs.minutos || 300 }}

      - name: Mandar los negocios nuevos a Google Sheets
        if: always()          # el script se saltea solo si todavia no hay secrets
        # Sin continue-on-error a proposito. Lo tenia para que una falla de
        # Sheets no se llevara puesta la corrida, pero de eso ya se encarga el
        # "if: always()" del paso que guarda: la base se commitea igual. Lo
        # unico que compraba era silencio, y salio caro: el 9/8 las dos
        # corridas figuraron en verde con el sync muerto y la planilla estuvo
        # dos dias sin una fila nueva. Que quede en rojo y llegue el mail.
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python sincronizar_sheets.py

      - name: Repartir leads a los vendedores
        if: always()          # el script se saltea solo si todavia no hay secrets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python repartir_leads.py

      - name: Liquidar comisiones
        if: always()          # el script se saltea solo si todavia no hay secrets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ORGANIZATE_TOKEN: ${{ secrets.ORGANIZATE_TOKEN }}
          # Sin esto las hojas de plata se protegen en modo aviso. Va como
          # secret y no en el codigo porque el repo es publico.
          SHEET_OWNER: ${{ secrets.SHEET_OWNER }}
        run: python liquidar_comisiones.py

      - name: Guardar resultados en el repo
        if: always()           # aunque el scraper falle, lo que junto se guarda
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nada de pull --rebase: negocios.db es binario y git no lo sabe
          # mergear, asi que si alguien empujo codigo mientras corriamos el
          # rebase quedaba a medias y se perdia la corrida entera (paso: 5
          # horas y 10814 negocios). En vez de eso movemos la base al ultimo
          # main y commiteamos SOLO los archivos de output encima. Nuestra
          # copia de la db es la buena (salio del checkout mas lo scrapeado)
          # y el codigo que hayan subido queda intacto.
          git fetch origin main
          git reset --mixed origin/main

          git add output/negocios.db output/Organizate.xlsx
          if git diff --staged --quiet; then
            echo "Sin novedades."
          else
            CON_TEL=$(python -c "import sqlite3;print(sqlite3.connect('output/negocios.db').execute(\"SELECT COUNT(*) FROM negocios WHERE telefono!=''\").fetchone()[0])")
            HECHAS=$(python -c "import sqlite3;print(sqlite3.connect('output/negocios.db').execute('SELECT COUNT(*) FROM busquedas_hechas').fetchone()[0])")
            git commit -m "Scraping: $CON_TEL negocios con telefono, $HECHAS busquedas hechas"
            git push origin HEAD:main
          fi
